name: Voxy animatable rig evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/features/voxyVideo/animatableMasterAsset.ts"
      - "apps/web/src/features/voxyVideo/selfHostedMotionStrategy.ts"
      - "apps/web/src/features/voxyVideo/characterMotionFixture.ts"
      - "apps/web/src/features/voxyVideo/characterMotionFixtureHtml.ts"
      - "apps/web/scripts/render-voxy-animatable-rig-evidence.ts"
      - "apps/web/public/brand/voxy/voxy-podcast-stage.png"
      - "apps/web/public/brands/voxy/characters/voxy-sitting-master.svg"
      - "apps/web/tests/voxy-animatable-master-asset.contract.test.ts"
      - "apps/web/tests/voxy-self-hosted-motion-strategy.contract.test.ts"
      - "apps/web/tests/voxy-character-motion-fixture.contract.test.ts"
      - ".github/workflows/voxy-animatable-rig-evidence.yml"

permissions:
  contents: read

jobs:
  render-evidence:
    name: Render exact-head local rig evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOXY_FIXTURE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install local renderer dependencies
        run: |
          pnpm -C apps/web exec playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run focused contracts
        run: |
          pnpm -C apps/web exec vitest run \
            tests/voxy-animatable-master-asset.contract.test.ts \
            tests/voxy-self-hosted-motion-strategy.contract.test.ts \
            tests/voxy-character-motion-fixture.contract.test.ts

      - name: Render revisionsgebundene Evidence
        run: |
          pnpm -w exec tsx \
            apps/web/scripts/render-voxy-animatable-rig-evidence.ts \
            --output=artifacts/voxy-animatable-rig-evidence

      - name: Verify fail-closed review metadata
        run: |
          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync("artifacts/voxy-animatable-rig-evidence/manifest.json","utf8"));if(m.exactHeadSha!==process.env.VOXY_FIXTURE_COMMIT_SHA||m.humanVisualAcceptance!=="pending"||m.productionEligible!==false||m.autoPublish!==false||m.render.durationMs!==8000||m.render.fps!==24||m.render.frameCount!==192||m.formats.length!==3)process.exit(1)'

      - name: Upload directly reviewable exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: voxy-animatable-rig-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/voxy-animatable-rig-evidence
          if-no-files-found: error
          retention-days: 14
