name: One-time Marketing Source Decision Intake

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/marketing-source-decision.trigger

permissions:
  contents: write

jobs:
  intake:
    if: github.event.pull_request.head.ref == 'docs/trigger-marketing-source-decision-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add canonical task and run preflight
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          task_id = 'MARKETING-SOURCE-DECISION-WORKSPACE-01'
          if task_id in text:
              raise SystemExit('Task already exists; refusing duplicate intake')

          truth_marker = ('- Commit `ce04fe67eaf96e5681064a68f4990221be5db88f` integrierte den vollständig geprüften '
                          'Marketing-Operator-Workspace und den Themenradar-Source-/Cluster-Contract auf `main`; '
                          '`MARKETING-WORKSPACE-OPERABILITY-01` steht bis zur erneuten Produktabnahme auf `review`, '
                          '`MARKETING-THEME-RADAR-SOURCE-CONTRACT-01` ist `done`, und Live-Ingestion bleibt über '
                          '`MARKETING-REGIONAL-SOURCE-DISCOVERY-02` am `manual_gate`.')
          truth_addition = ('\n- Nutzerkorrektur und Issue `#514` machen die Source-Allowlist und Providerentscheidung im '
                            'Marketing-Workspace sichtbar: `MARKETING-SOURCE-DECISION-WORKSPACE-01` ist als '
                            'read-only Entscheidungs- und Coverage-Fläche `codex_ready`; echte Providerverbindungen '
                            'und Live-Ingestion bleiben getrennte Manual Gates.')
          if truth_marker not in text:
              raise SystemExit('Current truth marker not found')
          text = text.replace(truth_marker, truth_marker + truth_addition, 1)

          row_marker = '| MARKETING-THEME-RADAR-SOURCE-CONTRACT-01 | done | P0 | Epic #442; Issue #498 | Source Registry, Coverage-Matrix, Topic-/Cluster-Schema, Ranking, Dedupe, Sprache, Lizenz, Retention | verbindlichen Vertrag für aktuelle Themen aus International, EU, Deutschland, Nachbarländern und 16 Bundesländern definieren | Contract und Schemas im Repo; keine leere UI; Live-Ingestion bleibt separater Gate-Slice | nein | Issue #498; Nutzerfreigabe 2026-07-28 |'
          new_row = '| MARKETING-SOURCE-DECISION-WORKSPACE-01 | codex_ready | P0 | MARKETING-THEME-RADAR-SOURCE-CONTRACT-01; Issue #514 | sichtbare `/admin/marketing/sources`-Entscheidungsfläche mit Coverage, Allowlist-/Providerstatus und realen Arbeitswegen | Source-Allowlist und Providerentscheidungen ohne GitHub-Kenntnisse auffindbar machen, ohne Live-Ingestion oder Fake-Provider | Navigation sichtbar; reale Contract-/Coverage-Daten; offene Entscheidungen verständlich; kein Demo-Feed; DE/EN; Tests, Lint, Typecheck und Build grün | nein | Issue #514; Nutzerkorrektur 2026-07-28 |'
          if row_marker not in text:
              raise SystemExit('Marketing table marker not found')
          text = text.replace(row_marker, row_marker + '\n' + new_row, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git add docs/E150/OpenTasks.md
          git commit -m "docs: queue marketing source decision workspace"
          git push origin HEAD:main

          node scripts/codex-task-preflight.mjs MARKETING-SOURCE-DECISION-WORKSPACE-01

  cleanup:
    if: always()
    needs: intake
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout of updated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/opentasks-marketing-source-decision-intake.yml ]; then
            git rm .github/workflows/opentasks-marketing-source-decision-intake.yml
            git commit -m "chore: remove one-time marketing source decision intake"
            git push origin HEAD:main
          fi
