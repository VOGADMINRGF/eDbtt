name: One-time Marketing Assistant UX Fix Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/opentasks-marketing-assistant-ux-fix-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Register task in canonical OpenTasks head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Historischer Katalog und Evidenz'
          if marker not in text:
              raise SystemExit('historical marker missing')
          head, archive = text.split(marker, 1)
          archive_hash = hashlib.sha256(archive.encode('utf-8')).hexdigest()
          lines = head.splitlines()

          task_id = 'MARKETING-CONTEXTUAL-ASSISTANT-UX-FIX-01'
          if any(line.startswith(f'| {task_id} |') for line in lines):
              raise SystemExit('task already exists')

          anchors = [i for i, line in enumerate(lines) if line.startswith('| MARKETING-CONTEXTUAL-ASSISTANT-01 |')]
          if len(anchors) != 1:
              raise SystemExit(f'assistant anchor count unexpected: {len(anchors)}')

          row = (
              '| MARKETING-CONTEXTUAL-ASSISTANT-UX-FIX-01 | codex_ready | P1 | '
              'MARKETING-CONTEXTUAL-ASSISTANT-01, MARKETING-CONTENT-OPERATIONS-READMODEL-02 | '
              'Issue `#490`: Marketing-Reviewweg, Handlungshierarchie, Daten-/Empfehlungssicherheit und Informationsdichte nach realer Videoabnahme korrigieren; MarketingContentOperation und MongoDB-EditorialItem nicht still vermischen | '
              '`2 Inhalte warten auf Prüfung` öffnet exakt diese zwei Marketinginhalte; Kampagnen ohne Inhalte priorisieren Inhalt/Briefing; Bestandsdaten und Empfehlungssicherheit sind verständlich getrennt; Aktionen, Kampagnendetails, Datenquellen und Editorial-Arbeit sind kompakt und operator-first; Tests grün |'
          )
          lines.insert(anchors[0] + 1, row)

          truth_anchor = '- PR `#478` wurde als Merge `f2b5e2e8693d9dc73cf0d3fe2eaa845071d89ea8` integriert; der kontextbezogene Marketing-Assistent ist read-only im Cockpit und in Insights umgesetzt, zeigt Datenqualität und höchstens drei reale nächste Schritte und wartet auf Produktabnahme.'
          truth_line = '- Die Videoabnahme von PR `#478` hat Issue `#490` / `MARKETING-CONTEXTUAL-ASSISTANT-UX-FIX-01` freigegeben: Der Review-Link muss die zwei Marketinginhalte wirklich zeigen, die Handlungshierarchie und Sicherheitsdarstellung werden operator-tauglich korrigiert.'
          if truth_line not in lines:
              positions = [i for i, line in enumerate(lines) if line == truth_anchor]
              if len(positions) != 1:
                  raise SystemExit('truth anchor missing or duplicated')
              lines.insert(positions[0] + 1, truth_line)

          queue_old = '- Issue `#445` ist der einzige aktuell ausführbare Marketing-Slice; `MARKETING-CONTEXTUAL-ASSISTANT-01` steht nach PR `#478` auf `review`, während Performance-Ingestion und Konten & Datenquellen bis zu realen Provider-, CSV-, Secret-Store- und Datenschutzfreigaben `manual_gate` bleiben.'
          queue_new = '- Issues `#445` und `#490` sind die aktuell ausführbaren, voneinander getrennten Marketing-Slices; `MARKETING-CONTEXTUAL-ASSISTANT-01` bleibt nach PR `#478` auf `review`, während Performance-Ingestion und Konten & Datenquellen bis zu realen Provider-, CSV-, Secret-Store- und Datenschutzfreigaben `manual_gate` bleiben.'
          if queue_old in lines:
              lines[lines.index(queue_old)] = queue_new
          elif queue_new not in lines:
              raise SystemExit('marketing queue truth missing')

          sync_positions = [i for i, line in enumerate(lines) if line.startswith('- Letzter gezielter Kopf-Sync:')]
          if len(sync_positions) != 1:
              raise SystemExit('head sync metadata missing or duplicated')
          lines[sync_positions[0]] = '- Letzter gezielter Kopf-Sync: Marketing Assistant UX Fix nach Videoabnahme / Issue `#490`; nicht berührte operative Zeilen behalten ihren zuletzt verifizierten Status.'

          new_head = '\n'.join(lines)
          if head.endswith('\n'):
              new_head += '\n'
          if hashlib.sha256(archive.encode('utf-8')).hexdigest() != archive_hash:
              raise SystemExit('historical archive changed unexpectedly')
          path.write_text(new_head + marker + archive, encoding='utf-8')
          PY

      - name: Run mandatory task preflight
        shell: bash
        run: |
          node scripts/codex-task-preflight.mjs MARKETING-CONTEXTUAL-ASSISTANT-UX-FIX-01

      - name: Validate, commit and self-remove
        shell: bash
        run: |
          grep -F '| MARKETING-CONTEXTUAL-ASSISTANT-UX-FIX-01 | codex_ready |' docs/E150/OpenTasks.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/opentasks-marketing-assistant-ux-fix-sync.yml
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(e150): queue marketing assistant UX fix'
          git push origin HEAD:main
