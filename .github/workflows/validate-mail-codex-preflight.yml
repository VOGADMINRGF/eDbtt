name: One-time Validate Mail Codex Preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-mail-codex-preflight.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run canonical preflight
        run: node scripts/codex-task-preflight.mjs MAIL-COMMUNICATION-CANON-01

      - name: Remove one-time workflow after successful validation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-mail-codex-preflight.yml
          git commit -m "chore: remove one-time mail preflight validation"
          git push origin HEAD:main
