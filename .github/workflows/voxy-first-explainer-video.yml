name: Voxy first explainer video evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/public/brands/voxy/references/canon/**"
      - "apps/web/public/brands/voxy/overlays/**"
      - "apps/web/src/features/voxyVideo/firstExplainerVideo.ts"
      - "apps/web/src/features/voxyVideo/firstExplainerVideoHtml.ts"
      - "apps/web/src/features/voxyVideo/staticCanonRecovery.ts"
      - "apps/web/src/features/voxyVideo/staticCanonRecoveryHtml.ts"
      - "apps/web/scripts/render-voxy-first-explainer-video.ts"
      - "apps/web/tests/voxy-first-explainer-video.contract.test.ts"
      - ".github/workflows/voxy-first-explainer-video.yml"

permissions:
  contents: read

jobs:
  render-first-explainer:
    name: Render exact-head first explainer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VOXY_EXPLAINER_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VOXY_DETECTOR_HEAD_SHA: 0756ad48bfd61cf88696f91bc41da87e988020c0

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch and bind unchanged PR 588 detector head
        run: |
          git fetch --no-tags origin hardening/voxy-200pct-visual-qa-01
          test "$(git rev-parse FETCH_HEAD)" = "$VOXY_DETECTOR_HEAD_SHA"
          git cat-file -e "$VOXY_DETECTOR_HEAD_SHA^{commit}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install local Chromium renderer and FFmpeg
        run: |
          pnpm -C apps/web exec playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run motion and explainer contracts
        run: |
          pnpm -C apps/web exec vitest run \
            tests/voxy-static-canon-recovery.contract.test.ts \
            tests/voxy-animatable-master-asset.contract.test.ts \
            tests/voxy-character-motion-fixture.contract.test.ts \
            tests/voxy-self-hosted-motion-strategy.contract.test.ts \
            tests/voxy-first-explainer-video.contract.test.ts

      - name: Render exact-head video evidence
        run: |
          pnpm -w exec tsx \
            apps/web/scripts/render-voxy-first-explainer-video.ts \
            --output=artifacts/voxy-first-explainer-video-v2

      - name: Verify media, captions and fail-closed gates
        run: |
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const p="artifacts/voxy-first-explainer-video-v2/",hash=f=>crypto.createHash("sha256").update(fs.readFileSync(p+f)).digest("hex");const files=["voxy-first-explainer-v2-16x9.mp4","voxy-first-explainer-v2-16x9.webm","preview.png","manifest.json","captions.de.vtt","captions.de.srt","standframes/start.png","standframes/vote4gov.png","standframes/edebatte.png","standframes/voiceopengov.png","standframes/end.png"];if(files.some(f=>!fs.existsSync(p+f)))process.exit(1);const m=JSON.parse(fs.readFileSync(p+"manifest.json","utf8"));if(m.schemaVersion!=="voxy-first-explainer-video-v2"||m.exactHeadSha!==process.env.VOXY_EXPLAINER_COMMIT_SHA||m.staticMasterHeadSha!=="ecba53e4167a6382d16dc2dda25c2f162dab8162"||m.durationMs!==17000||m.fps!==24||m.frameCount!==408||m.width!==1920||m.height!==1080||m.renderSize?.width!==1920||m.renderSize?.height!==1080||m.clipSha256!==hash("voxy-first-explainer-v2-16x9.mp4")||m.webmSha256!==hash("voxy-first-explainer-v2-16x9.webm")||m.captionSha256!==hash("captions.de.vtt")||m.externalVisualUploadUsed!==false||m.waveformCount!==1||m.waveformPlacement!=="behind_voxy"||m.audioProvenance?.audioIncluded!==false||m.brandQa?.lapelPin!=="VOG"||m.brandQa?.pocketMark!=="eDebatte"||m.brandQa?.pocketMarkStyle!=="wordmark_no_badge"||m.brandQa?.pocketBadgeGeometryPresent!==false||m.brandQa?.studioPrimary!=="VoiceOpenGov"||m.brandQa?.studioSecondary!=="eDebatte"||m.handQa?.detectorExactHeadSha!==process.env.VOXY_DETECTOR_HEAD_SHA||m.handQa?.status!=="blocked_human_review_required"||m.handQa?.thresholdsChanged!==false||m.handQa?.staticFiveFallbackUsed!==false||m.humanVisualAcceptance!=="pending"||m.productionEligible!==false||m.autoPublish!==false)process.exit(1)'
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -show_entries format=duration -of json artifacts/voxy-first-explainer-video-v2/voxy-first-explainer-v2-16x9.mp4
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 artifacts/voxy-first-explainer-video-v2/voxy-first-explainer-v2-16x9.mp4)"

      - name: Upload directly reviewable video artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxy-first-explainer-video-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/voxy-first-explainer-video-v2
          if-no-files-found: error
          retention-days: 14
