name: One-time Marketing OpenTasks Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/opentasks-marketing-control-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch canonical operational head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Historischer Katalog und Evidenz'
          if marker not in text:
              raise SystemExit('historical marker missing')

          head, archive = text.split(marker, 1)
          archive_hash = hashlib.sha256(archive.encode('utf-8')).hexdigest()
          lines = head.splitlines()

          analytics_index = None
          for index, line in enumerate(lines):
              if line.startswith('| MARKETING-CAMPAIGN-ANALYTICS-01 |'):
                  if analytics_index is not None:
                      raise SystemExit('duplicate analytics row in operational head')
                  analytics_index = index

          if analytics_index is None:
              raise SystemExit('analytics row missing in operational head')

          cells = [cell.strip() for cell in lines[analytics_index].split('|')[1:-1]]
          if len(cells) != 6:
              raise SystemExit(f'unexpected analytics row shape: {cells}')
          if cells[1] not in {'codex_ready', 'review'}:
              raise SystemExit(f'unexpected analytics status: {cells[1]}')
          cells[1] = 'review'
          cells[4] = 'Campaign-, Posting- und Performance-Control für B2C/B2B/B2G mit Regionen, Reichweitenraum, internen/externen Beiträgen, organisch/bezahlt, Scorecards und belegpflichtigen Metric Snapshots; PR `#472` ist gemergt'
          cells[5] = '13 Kampagnenprofile, Segment-/Reach-Filter, gestreuter Beitragsbestand und `/admin/marketing/insights` sind umgesetzt; Web-CI grün; fehlende Daten bleiben ausdrücklich nicht verbunden; Produkt-Sichtprüfung steht aus'
          lines[analytics_index] = '| ' + ' | '.join(cells) + ' |'

          ingestion_id = 'MARKETING-PERFORMANCE-INGESTION-02'
          ingestion_rows = [i for i, line in enumerate(lines) if line.startswith(f'| {ingestion_id} |')]
          if len(ingestion_rows) > 1:
              raise SystemExit('duplicate ingestion row in operational head')
          ingestion_line = (
              '| MARKETING-PERFORMANCE-INGESTION-02 | manual_gate | P1 | '
              'MARKETING-CAMPAIGN-ANALYTICS-01, Provider-/Credential-/Privacy-Entscheidungen | '
              'Verifizierte aggregierte eDebatte-, Social-, E-Mail-, Download- und Ads-Performance über sichere Provider- oder CSV-Adapter einlesen; Feldmapping, Credentials, Retention, Geografie, Freshness, Attribution, Rate Limits und Kosten vor Umsetzung festlegen | '
              'Reale Datenquellen und Feldgrenzen sind freigegeben; jede Metrik führt Quelle, Zeitraum, Erfassungszeit und Datenqualität; keine Secrets im Repo, keine personenbezogenen Marketingprofile, keine Fantasiewerte und keine Publishing- oder Budgetmutation |'
          )
          if ingestion_rows:
              lines[ingestion_rows[0]] = ingestion_line
          else:
              lines.insert(analytics_index + 1, ingestion_line)

          old_queue = '- Issue `#445` und Issue `#440` sind die einzigen aktuell ausführbaren Marketing-Slices; externe Source Discovery und Publish Approval bleiben echte Manual Gates.'
          new_queue = '- Issue `#445` ist der einzige aktuell ausführbare Marketing-Slice; `MARKETING-CAMPAIGN-ANALYTICS-01` steht nach PR `#472` auf `review`, und `MARKETING-PERFORMANCE-INGESTION-02` / Issue `#471` bleibt bis zu Provider-, Credential-, Privacy-, Retention-, Geografie- und Attributionsentscheidungen `manual_gate`.'
          if old_queue in lines:
              lines[lines.index(old_queue)] = new_queue
          elif new_queue not in lines:
              raise SystemExit('expected executable marketing queue bullet missing')

          pr469_prefix = '- PR `#469` wurde als Merge `e047f82bb96b5a2b03fa49f833acd59ab52070a1` integriert;'
          pr472_line = '- PR `#472` wurde als Merge `a6291c9dce64d27a6700f32cc4fc5ba897087781` integriert; `/admin/marketing` ist jetzt kampagnenzentriert nach B2C/B2B/B2G, Region und Reichweitenraum steuerbar, und `/admin/marketing/insights` bildet Scorecards sowie getrennte Datenquellen ab; reale Providerdaten bleiben offen.'
          if pr472_line not in lines:
              positions = [i for i, line in enumerate(lines) if line.startswith(pr469_prefix)]
              if len(positions) != 1:
                  raise SystemExit('PR #469 truth bullet missing or duplicated')
              lines.insert(positions[0] + 1, pr472_line)

          sync_prefix = '- Letzter gezielter Kopf-Sync:'
          sync_positions = [i for i, line in enumerate(lines) if line.startswith(sync_prefix)]
          if len(sync_positions) != 1:
              raise SystemExit('head sync metadata line missing or duplicated')
          lines[sync_positions[0]] = '- Letzter gezielter Kopf-Sync: Campaign-, Posting- und Performance-Control nach PR `#472` sowie Performance-Ingestion-Gate aus Issue `#471`; nicht berührte operative Zeilen behalten ihren zuletzt verifizierten Status.'

          new_head = '\n'.join(lines)
          if head.endswith('\n'):
              new_head += '\n'
          if hashlib.sha256(archive.encode('utf-8')).hexdigest() != archive_hash:
              raise SystemExit('historical archive changed unexpectedly')
          path.write_text(new_head + marker + archive, encoding='utf-8')
          PY

      - name: Validate and self-remove
        shell: bash
        run: |
          grep -F '| MARKETING-CAMPAIGN-ANALYTICS-01 | review |' docs/E150/OpenTasks.md
          grep -F '| MARKETING-PERFORMANCE-INGESTION-02 | manual_gate |' docs/E150/OpenTasks.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/opentasks-marketing-control-sync.yml
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(e150): sync marketing control and ingestion status'
          git push origin HEAD:main
