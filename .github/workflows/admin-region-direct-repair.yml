name: Admin Region Direct Queue Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/admin-region-repair-trigger.yml

permissions:
  contents: write

concurrency:
  group: admin-region-direct-queue-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize canonical admin region tasks
        run: python scripts/one-time-admin-region-queue-repair.py
      - name: Commit normalized queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md
          git diff --cached --quiet || git commit -m "docs: normalize admin region operating workspace queue"
          git push origin main
      - name: Run canonical task preflight
        run: node scripts/codex-task-preflight.mjs ADMIN-REGION-OPERATING-WORKSPACE-01
      - name: Remove one-time artifacts
        run: |
          git pull --ff-only origin main
          rm -f .github/workflows/opentasks-admin-region-workspace-sync.yml
          rm -f .github/workflows/opentasks-admin-region-repair-on-ci.yml
          rm -f .github/workflows/admin-region-repair-trigger.yml
          rm -f .github/workflows/admin-region-direct-repair.yml
          rm -f scripts/one-time-admin-region-queue-repair.py
          git add .github/workflows/opentasks-admin-region-workspace-sync.yml \
                  .github/workflows/opentasks-admin-region-repair-on-ci.yml \
                  .github/workflows/admin-region-repair-trigger.yml \
                  .github/workflows/admin-region-direct-repair.yml \
                  scripts/one-time-admin-region-queue-repair.py
          git diff --cached --quiet || git commit -m "chore: remove one-time admin region queue artifacts"
          git push origin main
