name: Voxy Animatable Master Contract

on:
  pull_request:
    paths:
      - "apps/web/src/features/voxyVideo/animatableMasterAsset.ts"
      - "apps/web/scripts/render-voxy-animatable-master.ts"
      - "apps/web/scripts/render-voxy-approved-look-candidate.ts"
      - "apps/web/tests/voxy-animatable-master-asset.contract.test.ts"
      - "apps/web/tests/voxy-animatable-layer-assets.contract.test.ts"
      - "apps/web/public/brands/voxy/rig/layers/**"
      - "docs/E150/VOXY-ANIMATABLE-MASTER-ASSET-01_2026-08-05.md"
      - ".github/workflows/voxy-animatable-master-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VOXY_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract-render-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and FFmpeg
        run: |
          pnpm -C apps/web exec playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run focused contracts
        run: |
          pnpm -C apps/web exec vitest run \
            tests/voxy-animatable-master-asset.contract.test.ts \
            tests/voxy-animatable-layer-assets.contract.test.ts
      - name: Render real 8-second layered master and crop evidence
        env:
          VOXY_EVIDENCE_COMMIT_SHA: ${{ env.VOXY_EXACT_HEAD_SHA }}
        run: pnpm -w exec tsx apps/web/scripts/render-voxy-animatable-master.ts --output=artifacts/voxy-animatable-master
      - name: Render approved-look visual recovery candidate
        env:
          VOXY_EVIDENCE_COMMIT_SHA: ${{ env.VOXY_EXACT_HEAD_SHA }}
        run: pnpm -w exec tsx apps/web/scripts/render-voxy-approved-look-candidate.ts --output=artifacts/voxy-approved-look-candidate
      - name: Verify exact-head render, themes and provenance evidence
        env:
          VOXY_EVIDENCE_COMMIT_SHA: ${{ env.VOXY_EXACT_HEAD_SHA }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/voxy-animatable-master/evidence-manifest.json','utf8'));
          if (manifest.commitSha !== process.env.VOXY_EVIDENCE_COMMIT_SHA) throw new Error('evidence_head_mismatch');
          if (Math.abs(manifest.render.durationSeconds - 8) > 0.08) throw new Error('render_duration_not_8_seconds');
          if (manifest.render.frameCount !== 192 || manifest.render.fps !== 24) throw new Error('render_frame_contract_broken');
          if (manifest.layerAssets.length !== 23) throw new Error('independent_layer_assets_missing');
          if (!manifest.layerSetSha256) throw new Error('layer_set_digest_missing');
          if (!manifest.cropEvidence.every((item) => item.sha256 && item.safeAreaVisible === true)) throw new Error('crop_evidence_missing');
          const themes = new Map(manifest.themePreviews.map((item) => [item.theme, item]));
          for (const theme of ['edebatte','vog_member']) {
            const preview = themes.get(theme);
            if (!preview?.sha256) throw new Error(`theme_preview_missing:${theme}`);
            if (!Array.isArray(preview.resolution?.resolvedJacketStops) || preview.resolution.resolvedJacketStops.length !== 2) throw new Error(`theme_stops_missing:${theme}`);
          }
          if (manifest.provenanceEvidence.layerSetSha256 !== manifest.layerSetSha256) throw new Error('provenance_layer_digest_mismatch');
          if (manifest.provenanceEvidence.thirdPartyAssetImports.length !== 0) throw new Error('unexpected_third_party_asset_import');
          if (manifest.provenanceEvidence.likenessReview.status !== 'pending_human_review') throw new Error('likeness_review_must_remain_human');
          if (manifest.provenanceEvidence.brandDistanceReview.status !== 'pending_human_review') throw new Error('brand_distance_review_must_remain_human');
          if (manifest.humanReview.status !== 'pending' || manifest.humanReview.approvedCommitSha !== null) throw new Error('self_approval_forbidden');

          const candidate = JSON.parse(fs.readFileSync('artifacts/voxy-approved-look-candidate/approved-look-candidate-manifest.json','utf8'));
          if (candidate.commitSha !== process.env.VOXY_EVIDENCE_COMMIT_SHA) throw new Error('approved_look_candidate_head_mismatch');
          if (candidate.canonicalVisualSource.repositoryPath !== 'apps/web/public/brand/voxy/voxy-podcast-stage.png') throw new Error('approved_look_source_mismatch');
          if (!candidate.canonicalVisualSource.sha256) throw new Error('approved_look_source_hash_missing');
          if (candidate.constraints.substituteCharacterForbidden !== true || candidate.constraints.identityGeometryRegeneration !== false) throw new Error('approved_look_guardrail_missing');
          if (candidate.renderMode !== 'approved_raster_identity_preserving_2_5d_candidate') throw new Error('approved_look_render_mode_mismatch');
          if (Math.abs(candidate.render.durationSeconds - 8) > 0.08 || candidate.render.frameCount !== 192 || candidate.render.fps !== 24) throw new Error('approved_look_render_contract_broken');
          if (!candidate.cropEvidence.every((item) => item.sha256 && item.safeAreaVisible === true)) throw new Error('approved_look_crop_evidence_missing');
          if (candidate.humanReview.status !== 'pending' || candidate.humanReview.approvedCommitSha !== null) throw new Error('approved_look_self_approval_forbidden');
          NODE
      - name: Typecheck
        run: pnpm -C apps/web run typecheck
      - name: Diff check
        run: git diff --check
      - name: Upload revision-bound render evidence
        uses: actions/upload-artifact@v4
        with:
          name: voxy-animatable-master-${{ env.VOXY_EXACT_HEAD_SHA }}
          path: |
            artifacts/voxy-animatable-master/**
            artifacts/voxy-approved-look-candidate/**
          if-no-files-found: error
          retention-days: 14
