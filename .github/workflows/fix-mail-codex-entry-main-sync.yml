name: One-time Mail Codex Entry Main Sync Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mail-codex-entry-main-sync.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure local main is current before preflight
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/E150/MAIL-COMMUNICATION-CANON-01_CODEX_ENTRY.md")
          text = path.read_text(encoding="utf-8")
          old = "  && git fetch origin \\\n  && node scripts/codex-task-preflight.mjs MAIL-COMMUNICATION-CANON-01 \\\n"
          new = "  && git fetch origin \\\n  && git pull --ff-only \\\n  && node scripts/codex-task-preflight.mjs MAIL-COMMUNICATION-CANON-01 \\\n"
          if old not in text:
              raise SystemExit("Expected terminal command anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git add docs/E150/MAIL-COMMUNICATION-CANON-01_CODEX_ENTRY.md
          git rm .github/workflows/fix-mail-codex-entry-main-sync.yml
          git commit -m "docs(mail): sync main before Codex preflight"
          git push origin HEAD:main
