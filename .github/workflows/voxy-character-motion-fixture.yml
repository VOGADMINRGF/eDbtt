name: Voxy character motion fixture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/features/voxy/**"
      - "apps/web/src/features/voxyVideo/modernCharacterContracts.ts"
      - "apps/web/src/features/voxyVideo/characterMotionFixture.ts"
      - "apps/web/src/features/voxyVideo/characterMotionFixtureHtml.ts"
      - "apps/web/scripts/render-voxy-character-motion-fixture.ts"
      - "apps/web/scripts/export-voxy-master-assets.ts"
      - "apps/web/scripts/validate-voxy-render-artifacts.ts"
      - "apps/web/tests/voxy-video-modern-character.contract.test.ts"
      - "apps/web/tests/voxy-character-motion-fixture.contract.test.ts"
      - "apps/web/tests/voxy-master-assets.contract.test.ts"
      - "apps/web/public/brand/voxy/fixtures/**"
      - "apps/web/public/brands/voxy/**"
      - "docs/E150/VOXY-CHARACTER-MOTION-FIXTURE-RENDER-01_2026-08-03.md"
      - "docs/E150/VOXY-MASTER-ASSET-SYSTEM-01_2026-08-04.md"
      - ".github/workflows/voxy-character-motion-fixture.yml"

permissions:
  contents: read

jobs:
  render-fixture:
    name: Render Voxy fixture and master assets
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and FFmpeg
        run: |
          pnpm -C apps/web exec playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run focused contracts
        run: |
          pnpm -C apps/web exec vitest run \
            tests/voxy-video-modern-character.contract.test.ts \
            tests/voxy-character-motion-fixture.contract.test.ts \
            tests/voxy-master-assets.contract.test.ts

      - name: Render review video 16:9
        run: |
          pnpm -w exec tsx apps/web/scripts/render-voxy-character-motion-fixture.ts \
            --format=16:9 \
            --output=artifacts/voxy-character-motion-fixture-16x9.mp4

      - name: Render review video 9:16
        run: |
          pnpm -w exec tsx apps/web/scripts/render-voxy-character-motion-fixture.ts \
            --format=9:16 \
            --output=artifacts/voxy-character-motion-fixture-9x16.mp4

      - name: Render review video 1:1
        run: |
          pnpm -w exec tsx apps/web/scripts/render-voxy-character-motion-fixture.ts \
            --format=1:1 \
            --output=artifacts/voxy-character-motion-fixture-1x1.mp4

      - name: Export production master 16:9
        run: |
          pnpm -w exec tsx apps/web/scripts/export-voxy-master-assets.ts \
            --format=16:9 --profile=production \
            --output=artifacts/voxy-master-16x9-production.png

      - name: Export production master 9:16
        run: |
          pnpm -w exec tsx apps/web/scripts/export-voxy-master-assets.ts \
            --format=9:16 --profile=production \
            --output=artifacts/voxy-master-9x16-production.png

      - name: Export production master 1:1
        run: |
          pnpm -w exec tsx apps/web/scripts/export-voxy-master-assets.ts \
            --format=1:1 --profile=production \
            --output=artifacts/voxy-master-1x1-production.png

      - name: Export 8K marketing proof 16:9
        run: |
          pnpm -w exec tsx apps/web/scripts/export-voxy-master-assets.ts \
            --format=16:9 --profile=marketing8k \
            --output=artifacts/voxy-master-16x9-marketing8k.png

      - name: Validate dimensions duration fps and file integrity
        run: pnpm -w exec tsx apps/web/scripts/validate-voxy-render-artifacts.ts

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxy-character-motion-and-master-assets
          path: |
            artifacts/voxy-character-motion-fixture-*
            artifacts/voxy-master-*
          if-no-files-found: error
          retention-days: 14
