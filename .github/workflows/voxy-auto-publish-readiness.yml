name: Voxy auto-publish readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/features/voxyPublishing/**"
      - "apps/web/tests/voxy-auto-publish-readiness.contract.test.ts"
      - "docs/E150/VOXY-AUTO-PUBLISH-READINESS-01_2026-08-04.md"
      - ".github/workflows/voxy-auto-publish-readiness.yml"

permissions:
  contents: read

jobs:
  readiness-contract:
    name: Validate shadow policy and 30-day review contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused readiness contracts
        run: |
          pnpm -C apps/web exec vitest run \
            tests/voxy-auto-publish-readiness.contract.test.ts

      - name: Typecheck web
        run: pnpm -C apps/web run typecheck

      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
