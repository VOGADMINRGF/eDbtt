name: OpenTasks Content Operations Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/opentasks-content-ops-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical OpenTasks head
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Historischer Katalog und Evidenz'
          if marker not in text:
              raise SystemExit('historical marker missing')

          section = '''\n## Phase Marketing Content Operations — operative Beiträge und Videos\n\n| ID | Status | Priorität | Abhängigkeiten | Scope | Akzeptanzkriterien |\n| --- | --- | --- | --- | --- | --- |\n| ADMIN-MARKETING-CONTENT-OPERATIONS-04 | done | P1 | ADMIN-MARKETING-OPERATING-DASHBOARD-02, PR `#468` | `/admin/marketing` priorisiert konkrete Beiträge, Videos, Freigaben, Termine, Veröffentlichungen und echte Ergebnisse statt Produktentwicklung, Evidence- oder Programmieraufgaben | PR `#468` ist gemergt; UI-, Guardrail-, Lint-, Typecheck- und Build-Prüfungen sind grün; Nutzerfreigabe vom 2026-07-27 liegt vor |\n| MARKETING-CONTENT-OPERATIONS-READMODEL-02 | codex_ready | P1 | ADMIN-MARKETING-CONTENT-OPERATIONS-04, Issue `#467` | Typisiertes repo-backed Readmodel für konkrete Posts, Videos und Kanalvarianten mit Caption/Script, Locale, Zielkanälen, Status, Termin, Verantwortlichkeit, CTA, Review- und Distribution-Verknüpfung; bestehende Campaign-, Asset- und Distribution-Wahrheit referenzieren statt duplizieren | `/admin/marketing` verwendet explizite Content-Operations-Daten; fehlende Termine und Veröffentlichungen bleiben ehrlich leer; kein Auto-Publish, keine Provider-Credentials, keine personenbezogenen Marketingprofile; fokussierte Contract- und UI-Tests sowie E150-Evidenz sind grün |\n\n'''

          if 'MARKETING-CONTENT-OPERATIONS-READMODEL-02' not in text:
              text = text.replace(marker, section + marker, 1)
          else:
              raise SystemExit('task already exists; refusing duplicate')

          truth = '- PR `#468` wurde gemergt und ersetzt die strategische Entwicklungsansicht von `/admin/marketing` durch konkrete Beiträge, Videos, Freigaben, Termine und belegte Veröffentlichungen; die Nutzerabnahme ist erfolgt.\n- Issue `#467` ist als `MARKETING-CONTENT-OPERATIONS-READMODEL-02` `codex_ready`; Auto-Publish und Provider-Anbindung bleiben ausgeschlossen.\n'
          anchor = '## Phase 0 — Governance und Production Gates'
          if anchor not in text:
              raise SystemExit('phase 0 marker missing')
          text = text.replace(anchor, truth + '\n' + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit canonical task sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md
          git commit -m "docs(e150): activate marketing content operations readmodel"
          git push origin HEAD:main
      - name: Run required task preflight
        run: node scripts/codex-task-preflight.mjs MARKETING-CONTENT-OPERATIONS-READMODEL-02
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/opentasks-content-ops-sync.yml
          git commit -m "chore: remove one-time OpenTasks sync workflow"
          git push origin HEAD:main
