name: Web CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -C apps/web typecheck

      - run: >-
          pnpm -C apps/web exec vitest run
          tests/admin-ai-orchestrator-smoke.route.test.ts
          tests/admin-ai-create-planner-smoke.route.test.ts
          tests/admin-ai-telemetry-ui.contract.test.ts
          tests/create-planner-debug-diagnostics.contract.test.ts
          tests/create-planner-timeout.contract.test.ts
          tests/openai-provider.reasoning.contract.test.ts
