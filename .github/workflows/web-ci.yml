name: Web CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -C apps/web typecheck

      - run: >-
          pnpm -C apps/web exec vitest run
          tests/admin-ai-orchestrator-smoke.route.test.ts
          tests/admin-ai-create-planner-smoke.route.test.ts
          tests/admin-ai-telemetry-ui.contract.test.ts
          tests/provider-smoke-model-fallback.contract.test.ts
          tests/topics.route.test.ts
          tests/create-intelligent-followup.contract.test.ts
          tests/create-workspace-actions.interaction.test.tsx
          tests/create-planner-debug-diagnostics.contract.test.ts
          tests/create-planner-timeout.contract.test.ts
          tests/openai-provider.reasoning.contract.test.ts

      - name: Build web from a clean checkout
        run: pnpm build
        env:
          JWT_SECRET: ci-build-only-not-a-production-secret-0123456789
          CORE_DB_NAME: ci_core
          CORE_MONGODB_URI: mongodb://127.0.0.1:27017/ci_core
          VOTES_DB_NAME: ci_votes
          VOTES_MONGODB_URI: mongodb://127.0.0.1:27017/ci_votes
          PII_DB_NAME: ci_pii
          PII_MONGODB_URI: mongodb://127.0.0.1:27017/ci_pii
          AI_CORE_READER_DB_NAME: ci_ai_core_reader
          AI_CORE_READER_MONGODB_URI: mongodb://127.0.0.1:27017/ci_ai_core_reader
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: ci
          NEO4J_PASSWORD: ci-build-only
          ARANGO_URL: http://127.0.0.1:8529
          ARANGO_DB: ci
          ARANGO_USER: ci
          ARANGO_ROOT_PASSWORD: ci-build-only
          MEMGRAPH_URI: bolt://127.0.0.1:7688
          MAIL_FROM: ci-build@example.invalid
