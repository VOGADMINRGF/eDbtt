name: One-shot Voxy SSOT reconciliation

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/ssot-voxy-delta-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 1

      - name: Verify exact trigger revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply fail-closed Voxy SSOT delta
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')

          voice = '| VOXY-VOICE-AND-CAPTION-FIXTURE-01 | review | P0 | Issue `#567`; PR `#590` | Providerneutralen DE/EN-Audio-, Aussprache-, Caption-Timeline-, WebVTT- und SRT-Vertrag mit revisionsgebundener Transcript-Bindung und Safe-Zones führen; lokale Teststimme ist kein Voxy-Stimm-Canon | Exact-Head-DE/EN-Evidence, Transcript↔Caption-Hard-Gate und SRT ohne interne Segment-IDs grün; Human Review bleibt separat; kein Lip-Sync, Upload, Scheduling oder Auto-Publish |'
          visual = '| VOXY-200PCT-VISUAL-QA-CHECKPOINT-01 | review | P0 | Issue `#580`; PR `#588`; `VOXY-FINAL-CANON-LOCK-01`; PR `#624` | Revisionsgebundenes 200-%-Regression-QA ausschließlich gegen `VOXY-V3.10.5-HUMAN-FINAL` für `16:9`, `9:16` und `1:1`; historische #589-Rig-Evidence ist keine aktuelle Human-Final-Referenz | PR `#588` bleibt Draft/fail-closed bis der Canon-Lock im getesteten Integrationsbaum vorhanden ist; Evidence bindet den tatsächlich getesteten Integrations-SHA; automatische Prüfung ersetzt keine menschliche Sichtabnahme; `productionEligible=false`; kein Publish |'
          canon = '| VOXY-FINAL-CANON-LOCK-01 | review | P0 | `VOXY-HOMEPAGE-REFERENCE-FILMS-01`; PR `#624`; PR `#720` | V3.10.5 als einzige aktuelle Character-/Visual-/Voice-Referenz maschinenlesbar und fail-closed an aktive Renderpfade binden; superseded pre-V3.10.5-Evidence darf keinen neuen Human-Review-Kandidaten erzeugen | Exact-Head-Canon-CI grün; realer Render-Einstieg validiert Canon vor Renderstart; alte aktive Renderer/Evidence-Workflows entfernt; neuer Canon nur nach neuer expliziter Human Final Acceptance; kein Auto-Publish |'

          patterns = {
              'voice': r'^\| VOXY-VOICE-AND-CAPTION-FIXTURE-01 \|.*$',
              'visual': r'^\| VOXY-200PCT-VISUAL-QA-CHECKPOINT-01 \|.*$',
          }
          for label, pattern in patterns.items():
              matches = re.findall(pattern, text, flags=re.M)
              if len(matches) != 1:
                  raise SystemExit(f'{label}_operative_row_count:{len(matches)}')

          if len(re.findall(r'^\| VOXY-FINAL-CANON-LOCK-01 \|.*$', text, flags=re.M)) != 0:
              raise SystemExit('canon_row_already_present_or_duplicated')

          text, n_voice = re.subn(patterns['voice'], voice, text, count=1, flags=re.M)
          text, n_visual = re.subn(patterns['visual'], visual, text, count=1, flags=re.M)
          if n_voice != 1 or n_visual != 1:
              raise SystemExit('voxy_row_replacement_failed')

          text = text.replace(visual, visual + '\n' + canon, 1)

          for task_id in (
              'VOXY-VOICE-AND-CAPTION-FIXTURE-01',
              'VOXY-200PCT-VISUAL-QA-CHECKPOINT-01',
              'VOXY-FINAL-CANON-LOCK-01',
          ):
              count = len(re.findall(rf'^\| {re.escape(task_id)} \|.*$', text, flags=re.M))
              if count != 1:
                  raise SystemExit(f'{task_id}_operative_row_count_after:{count}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- docs/E150/OpenTasks.md

      - name: Commit only canonical SSOT delta and self-delete helper
        run: |
          git config user.name "VOGADMINRGF"
          git config user.email "rgf@voiceopengov.de"
          git rm .github/workflows/ssot-voxy-delta-once.yml
          git add docs/E150/OpenTasks.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "docs/E150/OpenTasks.md "
          git commit -m "docs(e150): reconcile Voxy canon and production gates"
          git push origin HEAD:docs/governance-ssot-sync-05
