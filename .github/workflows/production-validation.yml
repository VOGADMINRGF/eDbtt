name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSLIST_IGNORE_OLD_DATA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm -w -r typecheck
      - run: pnpm -w -r lint
      - run: pnpm -C apps/web run typecheck
      - run: pnpm -C apps/web run lint

  production-gate:
    name: Production gate
    needs: static-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      ${{
        vars.PRODUCTION_VALIDATION_ENABLED == '1' &&
        secrets.JWT_SECRET != '' &&
        secrets.MAIL_FROM != '' &&
        secrets.CORE_DB_NAME != '' &&
        secrets.CORE_MONGODB_URI != '' &&
        secrets.VOTES_DB_NAME != '' &&
        secrets.VOTES_MONGODB_URI != '' &&
        secrets.PII_DB_NAME != '' &&
        secrets.PII_MONGODB_URI != '' &&
        secrets.AI_CORE_READER_DB_NAME != '' &&
        secrets.AI_CORE_READER_MONGODB_URI != '' &&
        secrets.NEO4J_URI != '' &&
        secrets.NEO4J_USER != '' &&
        secrets.NEO4J_PASSWORD != '' &&
        secrets.ARANGO_URL != '' &&
        secrets.ARANGO_DB != '' &&
        secrets.ARANGO_USER != '' &&
        secrets.ARANGO_ROOT_PASSWORD != '' &&
        secrets.MEMGRAPH_URI != ''
      }}
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      CORE_DB_NAME: ${{ secrets.CORE_DB_NAME }}
      CORE_MONGODB_URI: ${{ secrets.CORE_MONGODB_URI }}
      VOTES_DB_NAME: ${{ secrets.VOTES_DB_NAME }}
      VOTES_MONGODB_URI: ${{ secrets.VOTES_MONGODB_URI }}
      PII_DB_NAME: ${{ secrets.PII_DB_NAME }}
      PII_MONGODB_URI: ${{ secrets.PII_MONGODB_URI }}
      AI_CORE_READER_DB_NAME: ${{ secrets.AI_CORE_READER_DB_NAME }}
      AI_CORE_READER_MONGODB_URI: ${{ secrets.AI_CORE_READER_MONGODB_URI }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      ARANGO_URL: ${{ secrets.ARANGO_URL }}
      ARANGO_DB: ${{ secrets.ARANGO_DB }}
      ARANGO_USER: ${{ secrets.ARANGO_USER }}
      ARANGO_ROOT_PASSWORD: ${{ secrets.ARANGO_ROOT_PASSWORD }}
      MEMGRAPH_URI: ${{ secrets.MEMGRAPH_URI }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_TIMEOUT_MS: ${{ secrets.OPENAI_TIMEOUT_MS }}
      OPENAI_URL: ${{ secrets.OPENAI_URL }}
      BROWSERSLIST_IGNORE_OLD_DATA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vog/web build
      - run: pnpm run release:validate:production
