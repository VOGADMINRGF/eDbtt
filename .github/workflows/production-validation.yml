name: Production Validation

on:
  # Manual-only until a concrete production deployment contract exists.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-contract:
    name: Production contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSLIST_IGNORE_OLD_DATA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: cp apps/web/.env.example apps/web/.env.local
      - run: git diff --check
      - run: pnpm -C apps/web run typecheck
      - run: pnpm -C apps/web run lint
      - run: pnpm -C apps/web run build

  guardrail-smoke:
    name: Guardrail smoke
    needs: production-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSLIST_IGNORE_OLD_DATA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web run test:production-guardrails

  release-live-smoke:
    name: Release live smoke
    needs: [production-contract, guardrail-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: node scripts/ci/check-production-public-runtime.mjs
