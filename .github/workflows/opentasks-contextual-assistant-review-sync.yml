name: One-time Contextual Assistant Review Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/opentasks-contextual-assistant-review-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch canonical OpenTasks head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Historischer Katalog und Evidenz'
          if marker not in text:
              raise SystemExit('historical marker missing')
          head, archive = text.split(marker, 1)
          archive_hash = hashlib.sha256(archive.encode('utf-8')).hexdigest()
          lines = head.splitlines()

          indexes = [i for i, line in enumerate(lines) if line.startswith('| MARKETING-CONTEXTUAL-ASSISTANT-01 |')]
          if len(indexes) != 1:
              raise SystemExit(f'assistant row count unexpected: {len(indexes)}')
          index = indexes[0]
          cells = [cell.strip() for cell in lines[index].split('|')[1:-1]]
          if len(cells) != 6:
              raise SystemExit(f'unexpected assistant row shape: {cells}')
          if cells[1] not in {'codex_ready', 'review'}:
              raise SystemExit(f'unexpected assistant status: {cells[1]}')
          cells[1] = 'review'
          cells[4] = 'Issue `#475` / PR `#478`: kontextbezogenen read-only Marketing-Assistenten im Cockpit und in Insights bereitstellen; Kampagnenstand, Datenqualität, Belege, Grenzen und maximal drei reale nächste Schritte verständlich anzeigen'
          cells[5] = 'Merge `f2b5e2e8693d9dc73cf0d3fe2eaa845071d89ea8` und vollständige Web-CI sind grün; keine Mutation, Terminierung, Providerverbindung oder Veröffentlichung; Desktop-/Mobile-Produktabnahme steht vor `done` aus'
          lines[index] = '| ' + ' | '.join(cells) + ' |'

          old_queue = '- Issue `#445` und Issue `#475` sind die aktuell ausführbaren, voneinander getrennten Marketing-Slices; `MARKETING-CAMPAIGN-ANALYTICS-01` bleibt nach PR `#472` auf `review`, während Performance-Ingestion und Konten & Datenquellen bis zu realen Provider-, CSV-, Secret-Store- und Datenschutzfreigaben `manual_gate` bleiben.'
          new_queue = '- Issue `#445` ist der einzige aktuell ausführbare Marketing-Slice; `MARKETING-CONTEXTUAL-ASSISTANT-01` steht nach PR `#478` auf `review`, während Performance-Ingestion und Konten & Datenquellen bis zu realen Provider-, CSV-, Secret-Store- und Datenschutzfreigaben `manual_gate` bleiben.'
          if old_queue in lines:
              lines[lines.index(old_queue)] = new_queue
          elif new_queue not in lines:
              raise SystemExit('expected marketing queue bullet missing')

          architecture_line = '- Issues `#474`, `#475` und `#476` präzisieren die Marketing-Arbeitsarchitektur: tägliches Cockpit, nachgelagerte Konten-&-Datenquellen-Fläche, kontextbezogener read-only Assistent und separat geschützte spätere Automation.'
          pr478_line = '- PR `#478` wurde als Merge `f2b5e2e8693d9dc73cf0d3fe2eaa845071d89ea8` integriert; der kontextbezogene Marketing-Assistent ist read-only im Cockpit und in Insights umgesetzt, zeigt Datenqualität und höchstens drei reale nächste Schritte und wartet auf Produktabnahme.'
          if pr478_line not in lines:
              positions = [i for i, line in enumerate(lines) if line == architecture_line]
              if len(positions) != 1:
                  raise SystemExit('assistant architecture truth bullet missing or duplicated')
              lines.insert(positions[0] + 1, pr478_line)

          sync_prefix = '- Letzter gezielter Kopf-Sync:'
          sync_positions = [i for i, line in enumerate(lines) if line.startswith(sync_prefix)]
          if len(sync_positions) != 1:
              raise SystemExit('head sync metadata missing or duplicated')
          lines[sync_positions[0]] = '- Letzter gezielter Kopf-Sync: contextual Marketing Assistant nach PR `#478`; nicht berührte operative Zeilen behalten ihren zuletzt verifizierten Status.'

          new_head = '\n'.join(lines)
          if head.endswith('\n'):
              new_head += '\n'
          if hashlib.sha256(archive.encode('utf-8')).hexdigest() != archive_hash:
              raise SystemExit('historical archive changed unexpectedly')
          path.write_text(new_head + marker + archive, encoding='utf-8')
          PY

      - name: Validate, commit and self-remove
        shell: bash
        run: |
          grep -F '| MARKETING-CONTEXTUAL-ASSISTANT-01 | review |' docs/E150/OpenTasks.md
          grep -F '| MARKETING-CONNECTIONS-CONTROL-PLANE-03 | manual_gate |' docs/E150/OpenTasks.md
          grep -F '| MARKETING-ASSISTANT-AUTOMATION-02 | blocked |' docs/E150/OpenTasks.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/opentasks-contextual-assistant-review-sync.yml
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(e150): move contextual marketing assistant to review'
          git push origin HEAD:main
