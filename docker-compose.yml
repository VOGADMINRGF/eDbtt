version: "3.9"
services:
  mongo_core:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [ "mongo_core_data:/data/db" ]

  mongo_votes:
    image: mongo:7
    restart: unless-stopped
    ports: ["27018:27017"]
    volumes: [ "mongo_votes_data:/data/db" ]

  mongo_pii:
    image: mongo:7
    restart: unless-stopped
    ports: ["27019:27017"]
    volumes: [ "mongo_pii_data:/data/db" ]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server","--appendonly","yes"]
    volumes: [ "redis_data:/data" ]

  neo4j:
    image: neo4j:5.22
    restart: unless-stopped
    profiles: ["graph"]
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/test1234}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins

volumes:
  mongo_core_data:
  mongo_votes_data:
  mongo_pii_data:
  redis_data:
  neo4j_data:
  neo4j_plugins:
