<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">eDebatte pocket wordmark</title>
  <desc id="desc">High-resolution reconstructed eDebatte wordmark without badge, box, or second line.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00D9C0"/>
      <stop offset="1" stop-color="#1E6BFF"/>
    </linearGradient>
  </defs>
  <text x="400" y="174" fill="url(#brand)" stroke="#061027" stroke-width="34" paint-order="stroke fill" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="700" letter-spacing="-4" text-anchor="middle">eDebatte</text>
</svg>
